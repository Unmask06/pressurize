name: Release

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write  # Needed for creating persistent web build release

jobs:
  # 1. Identify trigger & 2. Detect changes
  # On manual trigger: all outputs are true (nothing skipped)
  # On push: only changed paths are true
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.set-changes.outputs.frontend }}
      backend: ${{ steps.set-changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            frontend: frontend/**
            backend: backend/**
      - name: Set change outputs
        id: set-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          fi

  # 3. Build frontend
  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - run: cd frontend && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pressurize-dist
          path: frontend/dist/

      # Persistent release asset — survives beyond 90-day artifact retention
      - name: Package web dist for persistent release
        run: |
          cd frontend
          tar -czf pressurize-web-dist.tar.gz -C dist .

      - name: Upload to persistent latest-web release
        run: |
          gh release delete latest-web --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-web frontend/pressurize-web-dist.tar.gz \
            --title "Latest Web Build" \
            --notes "Auto-generated web build for XergiZ integration. Do not delete." \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3.1 Notify xergiz frontend
  notify-xergiz-frontend:
    needs: [detect-changes, build-frontend]
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.XERGIZ_TRIGGER_TOKEN }}
          repository: XergiZ/xergiz
          event-type: product-updated
          client-payload: |
            {
              "product": "pressurize",
              "product_id": "pressurize",
              "run_id": "${{ github.run_id }}",
              "repo": "${{ github.repository }}"
            }

  # 4. Notify xergiz backend
  notify-xergiz-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.XERGIZ_TRIGGER_TOKEN }}
          repository: XergiZ/xergiz
          event-type: product-backend-updated
          client-payload: |
            {
              "product": "pressurize",
              "product_id": "pressurize",
              "run_id": "${{ github.run_id }}",
              "repo": "${{ github.repository }}"
            }
