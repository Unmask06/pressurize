name: Release

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and release all'
        required: false
        type: boolean
        default: true

permissions:
  contents: write  # Needed for creating persistent web build release

jobs:
  # 1. Identify trigger & 2. Detect changes (push only)
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: frontend/**
            backend: backend/**

  # 3. Build frontend
  build-frontend:
    needs: detect-changes
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pressurize-dist
          path: frontend/dist/

      # Persistent release asset — survives beyond 90-day artifact retention
      - name: Package web dist for persistent release
        run: |
          cd frontend
          tar -czf pressurize-web-dist.tar.gz -C dist .

      - name: Upload to persistent latest-web release
        run: |
          gh release upload latest-web frontend/pressurize-web-dist.tar.gz --clobber 2>/dev/null || \
          gh release create latest-web frontend/pressurize-web-dist.tar.gz \
            --title "Latest Web Build" \
            --notes "Auto-generated web build for XergiZ integration. Do not delete." \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3.1 Notify xergiz frontend
  notify-xergiz-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch to XergiZ frontend
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.XERGIZ_TRIGGER_TOKEN }}
          repository: XergiZ/xergiz
          event-type: product-updated
          client-payload: |
            {
              "product": "pressurize",
              "product_id": "pressurize",
              "run_id": "${{ github.run_id }}",
              "repo": "${{ github.repository }}"
            }

  # 4. Notify xergiz backend
  notify-xergiz-backend:
    needs: detect-changes
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch to XergiZ backend
        uses: peter-evans/repository-dispatch@v3
        continue-on-error: true
        with:
          token: ${{ secrets.XERGIZ_TRIGGER_TOKEN }}
          repository: XergiZ/xergiz
          event-type: product-backend-updated
          client-payload: |
            {
              "product": "pressurize",
              "product_id": "pressurize",
              "run_id": "${{ github.run_id }}",
              "repo": "${{ github.repository }}"
            }
